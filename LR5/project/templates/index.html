<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма отправки данных</title>
    <script>
        function setCurrentTime() {
            const currentTime = new Date().toLocaleTimeString('ru-RU');
            document.getElementById("current_time").value = currentTime;
        }
        window.onload = setCurrentTime;
    </script>
</head>
<body>
    <div class="container">
    <h1>Введите данные</h1>

    <!-- Отображение flash-сообщений -->
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            <div class="alert alert-dismissible fade show" role="alert">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('submit') }}" method="POST">
        <div class="form-group">
            <label for="login">Логин:</label>
            <input type="text" name="login" id="login" required class="form-control">
        </div>
        <div class="form-group">
            <label for="current_time">Текущее время:</label>
            <input type="text" name="current_time" id="current_time" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
